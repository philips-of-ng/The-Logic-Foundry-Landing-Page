<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The Logic Foundry</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL and redirects it to index.html with the path encoded,
      // EXCEPT if it's a direct request for a static asset like a PDF.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      if (l.pathname.endsWith('.pdf')) {
        // Allow direct PDF links to load naturally
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
